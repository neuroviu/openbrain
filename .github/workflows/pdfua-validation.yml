name: NeuroViu PDF-UA Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "NeuroViu_PDFUA_Cloud_Setup/pdfua-inputs/**"
      - ".github/workflows/pdfua-validation.yml"

permissions:
  contents: read

jobs:
  validate-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded remediation candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pdfua-reports pdfua-current
          archive="NeuroViu_PDFUA_Cloud_Setup/pdfua-inputs/NeuroViu_PDFUA_Remediation_Candidates.zip"
          test -s "$archive"
          unzip -l "$archive"
          unzip -oq "$archive" -d pdfua-current
          find pdfua-current -type f -iname '*.pdf' -print | sort > pdfua-reports/input-files.txt
          cat pdfua-reports/input-files.txt
          test "$(wc -l < pdfua-reports/input-files.txt)" -eq 2
          if ! grep -iq 'accommodation' pdfua-reports/input-files.txt || ! grep -iq 'toolkit' pdfua-reports/input-files.txt; then
            echo "Expected accommodation form and toolkit PDF in uploaded archive."
            exit 1
          fi
          while IFS= read -r file; do sha256sum "$file"; done < pdfua-reports/input-files.txt > pdfua-reports/input-sha256.txt

      - name: Pull veraPDF CLI image
        run: docker pull verapdf/cli:v1.30.2

      - name: Validate extracted PDFs against PDF-UA-1
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          index=0
          while IFS= read -r file; do
            index=$((index + 1))
            name="$(basename "$file" .pdf)"
            echo "Validating extracted file: $file"
            if docker run --rm -v "$PWD:/data:ro" verapdf/cli:v1.30.2 \
                --flavour ua1 --format xml "/data/$file" \
                > "pdfua-reports/${index}-${name}.xml" \
                2> "pdfua-reports/${index}-${name}.log"; then
              echo "veraPDF CLI succeeded for $name"
            else
              echo "veraPDF CLI returned failure for $name"
              failed=1
            fi
            report="pdfua-reports/${index}-${name}.xml"
            if ! grep -Eq '<validationReport[^>]*isCompliant="(true|false)"' "$report"; then
              echo "Missing compliance result: $report"
              failed=1
            elif grep -Eq '<validationReport[^>]*isCompliant="false"' "$report"; then
              echo "PDF-UA-1 nonconformance: $name (inspect XML report)"
              failed=1
            else
              echo "PDF-UA-1 validation PASS: $name"
            fi
          done < pdfua-reports/input-files.txt
          exit "$failed"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuroviu-pdfua-reports
          path: pdfua-reports/
          if-no-files-found: error
