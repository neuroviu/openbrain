name: NeuroViu PDF-UA Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "NeuroViu_PDFUA_Cloud_Setup/pdfua-inputs/**"
      - ".github/workflows/pdfua-validation.yml"

permissions:
  contents: read

jobs:
  validate-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Identify exactly two corrected PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pdfua-reports
          base="NeuroViu_PDFUA_Cloud_Setup/pdfua-inputs"
          test -s "$base/NeuroViu_Accommodation_Planning_Form_Structure_Updated.pdf"
          test -s "$base/NeuroViu_Toolkit_v1_Content_Corrected.pdf"
          printf '%s\n' \
            "$base/NeuroViu_Accommodation_Planning_Form_Structure_Updated.pdf" \
            "$base/NeuroViu_Toolkit_v1_Content_Corrected.pdf" \
            > pdfua-reports/input-files.txt
          sha256sum "$base"/*.pdf > pdfua-reports/input-sha256.txt
          cat pdfua-reports/input-files.txt

      - name: Pull official veraPDF CLI image
        run: docker pull ghcr.io/verapdf/cli:v1.31.202

      - name: Validate against PDF-UA-1
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            name="$(basename "$file" .pdf)"
            echo "Validating $file"
            if docker run --rm -v "$PWD:/data:ro" ghcr.io/verapdf/cli:v1.31.202 \
                --flavour ua1 --format xml "/data/$file" \
                > "pdfua-reports/${name}.xml" \
                2> "pdfua-reports/${name}.log"; then
              echo "veraPDF completed for $name"
            else
              echo "veraPDF command failed for $name"
              failed=1
            fi
            if ! grep -Eq '<validationReport[^>]*isCompliant="true"|<validationReport[^>]*isCompliant="false"' "pdfua-reports/${name}.xml"; then
              echo "Missing PDF/UA validation result for $name"
              failed=1
            elif grep -Eq '<validationReport[^>]*isCompliant="false"' "pdfua-reports/${name}.xml"; then
              echo "Nonconformant PDF: $name (see report)"
              failed=1
            fi
          done < pdfua-reports/input-files.txt
          exit "$failed"

      - name: Upload evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuroviu-pdfua-reports
          path: pdfua-reports/
          if-no-files-found: error
